<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Misprint Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. Header (score, name, best) / square 8x8 board / tray of three pieces / hint line.
   Look: riso-print inks on cool paper, halftone fill, and an offset overprint shadow on every block. */
:root {
  --bg: #E8EBF3;
  --surface: #F5F6FA;
  --fg: #14172E;
  --muted: #5A607C;
  --slot: #D6DBE9;
  --line: #C3C9DC;
  --veil: rgba(232, 235, 243, 0.86);
  --shadow: rgba(20, 23, 46, 0.24);
  --accent: #2F4BF0;
  --accent-fg: #FFFFFF;
  --on-ink: #14172E;
  --ink-0: #3A5BFF;
  --ink-1: #FF4F8B;
  --ink-2: #FFC21A;
  --ink-3: #00A896;
  --ink-4: #FF7B25;
  --ink-5: #8A4FFF;
  --font-display: 'Unbounded', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --gap: 3px;
  --pad: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101330;
    --surface: #191C3F;
    --fg: #ECEEF9;
    --muted: #98A0C6;
    --slot: #242851;
    --line: #333970;
    --veil: rgba(16, 19, 48, 0.86);
    --shadow: rgba(0, 0, 0, 0.5);
    --accent: #8FA2FF;
    --accent-fg: #101330;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101330;
  --surface: #191C3F;
  --fg: #ECEEF9;
  --muted: #98A0C6;
  --slot: #242851;
  --line: #333970;
  --veil: rgba(16, 19, 48, 0.86);
  --shadow: rgba(0, 0, 0, 0.5);
  --accent: #8FA2FF;
  --accent-fg: #101330;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 14px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  --cell: 44px;
  --tc: 22px;
  --tray-h: 132px;
  --bw: calc(var(--cell) * 8 + var(--gap) * 7 + var(--pad) * 2);
  height: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Header */
.bar {
  width: var(--bw);
  align-self: center;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 8px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat.end { align-items: flex-end; }
.lab {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.num.small { font-size: 18px; }
.num.bump { animation: bump 0.3s ease-out; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  text-shadow: 1.5px 1.5px 0 var(--ink-1);
}
.chip {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--ink-2);
  color: var(--on-ink);
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  visibility: hidden;
}
.chip.on { visibility: visible; }

/* Board */
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.board {
  position: relative;
  width: var(--bw);
  height: var(--bw);
  padding: var(--pad);
  display: grid;
  grid-template-columns: repeat(8, var(--cell));
  grid-template-rows: repeat(8, var(--cell));
  gap: var(--gap);
  background: var(--surface);
  border-radius: 14px;
  box-shadow: 0 0 0 2px var(--line), 5px 5px 0 var(--shadow);
}
.cell { position: relative; border-radius: 5px; background: var(--slot); }
.k0 { --c: var(--ink-0); }
.k1 { --c: var(--ink-1); }
.k2 { --c: var(--ink-2); }
.k3 { --c: var(--ink-3); }
.k4 { --c: var(--ink-4); }
.k5 { --c: var(--ink-5); }
.blk, .cell.f {
  background-color: var(--c);
  background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.28) 0 1.1px, transparent 1.6px);
  background-size: 5px 5px;
  box-shadow: 2px 2px 0 var(--shadow);
}
.blk { border-radius: 5px; }
.cell.g::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--c);
  opacity: 0.6;
}
.cell.hot::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 3px var(--fg);
  z-index: 2;
}
.fx, .over { position: absolute; inset: 0; border-radius: inherit; }
.fx { pointer-events: none; z-index: 4; }
.burst { position: absolute; animation: burst 0.45s cubic-bezier(0.3, 0.7, 0.3, 1) var(--d, 0ms) both; }
.pop {
  position: absolute;
  z-index: 6;
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  animation: pop 1.1s ease-out forwards;
}
.pop b {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  background: var(--fg);
  color: var(--bg);
  padding: 6px 12px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.pop span {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--ink-2);
  color: var(--on-ink);
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.over {
  z-index: 8;
  display: grid;
  place-items: center;
  background: var(--veil);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
.panel { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.final {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 46px;
  line-height: 1.1;
  text-shadow: 2px 2px 0 var(--ink-1);
  font-variant-numeric: tabular-nums;
}
.note { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }

/* Tray */
.tray {
  width: var(--bw);
  height: var(--tray-h);
  align-self: center;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.slot {
  min-width: 0;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 0 0 1.5px var(--line);
  touch-action: none;
  cursor: grab;
}
.slot.used { background: transparent; box-shadow: 0 0 0 1.5px var(--line) inset; opacity: 0.5; cursor: default; }
.slot.lifted .piece { opacity: 0.2; }
.slot.stuck .piece { opacity: 0.35; filter: grayscale(0.6); }
.piece { display: grid; gap: 2px; pointer-events: none; }
.piece .blk { border-radius: 4px; box-shadow: 1.5px 1.5px 0 var(--shadow); }
.drag {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 50;
  display: grid;
  gap: var(--gap);
  pointer-events: none;
  will-change: transform;
}
.drag .blk { box-shadow: 3px 4px 0 var(--shadow); }

/* Footer */
.foot {
  width: var(--bw);
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.hint { margin: 0; flex: 1; min-width: 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
.btn {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1.5px solid var(--fg);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); padding: 14px 22px; font-size: 12px; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@keyframes burst {
  0% { transform: scale(1); filter: brightness(1); }
  35% { transform: scale(1.14); filter: brightness(1.35); }
  100% { transform: scale(0) rotate(30deg); opacity: 0; }
}
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  70% { opacity: 1; transform: translate(-50%, -90%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}
@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .burst, .pop, .num.bump { animation-duration: 0.01ms; animation-delay: 0ms; }
}
</style>

<div id="app">
  <header class="bar">
    <div class="stat">
      <span class="lab">Score</span>
      <span class="num" id="score">0</span>
    </div>
    <div class="brand">
      <span class="name">Misprint</span>
      <span class="chip" id="streak">Streak ×2</span>
    </div>
    <div class="stat end">
      <span class="lab">Best</span>
      <span class="num small" id="best">0</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board" aria-label="Game board, 8 by 8">
      <div class="fx" id="fx"></div>
      <div class="over" id="over" hidden>
        <div class="panel">
          <p class="lab">No room left</p>
          <p class="final" id="finalScore">0</p>
          <p class="note" id="finalNote"></p>
          <button class="btn primary" id="again" type="button">Play again</button>
        </div>
      </div>
    </div>
  </main>

  <section class="tray" id="tray" aria-label="Pieces to place"></section>

  <footer class="foot">
    <p class="hint" id="hint">Drag a piece onto the grid. Fill a row or column to clear it.</p>
    <button class="btn" id="restart" type="button">New game</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  // LOGIC-START
  const N = 8;
  const COLORS = 6;

  // Piece families with a spawn weight. Every rotation and mirror image is generated from the pattern.
  const GROUPS = [
    { w: 1,   p: ['#'] },
    { w: 2,   p: ['##'] },
    { w: 3,   p: ['###'] },
    { w: 2,   p: ['####'] },
    { w: 1,   p: ['#####'] },
    { w: 3,   p: ['##', '##'] },
    { w: 1,   p: ['###', '###', '###'] },
    { w: 1.5, p: ['###', '###'] },
    { w: 3,   p: ['#.', '##'] },
    { w: 2.5, p: ['#.', '#.', '##'] },
    { w: 2,   p: ['.#.', '###'] },
    { w: 2,   p: ['.##', '##.'] },
    { w: 1,   p: ['#..', '#..', '###'] },
    { w: 1,   p: ['##', '##', '#.'] }
  ];

  function norm(cells) {
    const mr = Math.min.apply(null, cells.map(function (q) { return q[0]; }));
    const mc = Math.min.apply(null, cells.map(function (q) { return q[1]; }));
    return cells
      .map(function (q) { return [q[0] - mr, q[1] - mc]; })
      .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  }
  function parse(rows) {
    const cells = [];
    rows.forEach(function (s, r) {
      for (let c = 0; c < s.length; c++) if (s[c] === '#') cells.push([r, c]);
    });
    return norm(cells);
  }
  function variants(cells) {
    const seen = new Map();
    let cur = cells;
    for (let f = 0; f < 2; f++) {
      for (let k = 0; k < 4; k++) {
        cur = norm(cur.map(function (q) { return [q[1], -q[0]]; }));
        seen.set(JSON.stringify(cur), cur);
      }
      cur = norm(cur.map(function (q) { return [q[0], -q[1]]; }));
    }
    return Array.from(seen.values());
  }
  const SHAPES = GROUPS.map(function (g) { return { w: g.w, vars: variants(parse(g.p)) }; });
  const TOTAL_W = SHAPES.reduce(function (a, s) { return a + s.w; }, 0);

  function dims(cells) {
    return {
      h: Math.max.apply(null, cells.map(function (q) { return q[0]; })) + 1,
      w: Math.max.apply(null, cells.map(function (q) { return q[1]; })) + 1
    };
  }
  function randomPiece(rng) {
    let x = rng() * TOTAL_W;
    let g = SHAPES[SHAPES.length - 1];
    for (let i = 0; i < SHAPES.length; i++) {
      if (x < SHAPES[i].w) { g = SHAPES[i]; break; }
      x -= SHAPES[i].w;
    }
    const cells = g.vars[Math.floor(rng() * g.vars.length)];
    return { cells: cells.map(function (q) { return q.slice(); }), color: Math.floor(rng() * COLORS) };
  }

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < N; r++) g.push(new Array(N).fill(-1));
    return g;
  }
  function cloneGrid(g) { return g.map(function (row) { return row.slice(); }); }
  function canPlace(g, cells, r0, c0) {
    for (let i = 0; i < cells.length; i++) {
      const r = r0 + cells[i][0], c = c0 + cells[i][1];
      if (r < 0 || r >= N || c < 0 || c >= N || g[r][c] !== -1) return false;
    }
    return true;
  }
  function fitsAnywhere(g, cells) {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (canPlace(g, cells, r, c)) return true;
    return false;
  }

  // Places a piece on a copy of the grid, then clears every full row and column at once.
  function applyMove(g, piece, r0, c0) {
    const ng = cloneGrid(g);
    piece.cells.forEach(function (q) { ng[r0 + q[0]][c0 + q[1]] = piece.color; });
    const rows = [], cols = [];
    for (let r = 0; r < N; r++) if (ng[r].every(function (v) { return v >= 0; })) rows.push(r);
    for (let c = 0; c < N; c++) if (ng.every(function (row) { return row[c] >= 0; })) cols.push(c);
    const mark = new Set();
    rows.forEach(function (r) { for (let c = 0; c < N; c++) mark.add(r * N + c); });
    cols.forEach(function (c) { for (let r = 0; r < N; r++) mark.add(r * N + c); });
    const cleared = [];
    mark.forEach(function (k) {
      const r = Math.floor(k / N), c = k % N;
      cleared.push([r, c, ng[r][c]]);
    });
    cleared.forEach(function (q) { ng[q[0]][q[1]] = -1; });
    return { grid: ng, rows: rows, cols: cols, cleared: cleared, lines: rows.length + cols.length };
  }

  // 1 line = 10, 2 = 30, 3 = 60, 4 = 100, multiplied by the current streak.
  function clearPoints(lines, streak) { return 10 * lines * (lines + 1) / 2 * streak; }

  // True when the pieces can all be placed, in some order, starting from this grid.
  function solvable(g, pieces) {
    let budget = 4000;
    function go(grid, list) {
      if (!list.length) return true;
      if (budget <= 0) return true;
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        const rest = list.filter(function (_, j) { return j !== i; });
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (!canPlace(grid, p.cells, r, c)) continue;
            budget--;
            if (go(applyMove(grid, p, r, c).grid, rest)) return true;
            if (budget <= 0) return true;
          }
        }
      }
      return false;
    }
    return go(g, pieces);
  }

  function makeTray(g, rng) {
    let fallback = null;
    for (let t = 0; t < 20; t++) {
      const ps = [randomPiece(rng), randomPiece(rng), randomPiece(rng)];
      if (!ps.every(function (p) { return fitsAnywhere(g, p.cells); })) {
        if (!fallback && ps.some(function (p) { return fitsAnywhere(g, p.cells); })) fallback = ps;
        continue;
      }
      if (solvable(g, ps)) return ps;
      if (!fallback) fallback = ps;
    }
    if (fallback) return fallback;
    return [0, 1, 2].map(function () { return { cells: [[0, 0]], color: Math.floor(rng() * COLORS) }; });
  }
  // LOGIC-END

  /* ---------- UI ---------- */
  const GAP = 3, PAD = 6;
  const $ = function (id) { return document.getElementById(id); };
  const app = $('app'), stage = $('stage'), boardEl = $('board'), fxEl = $('fx'), overEl = $('over');
  const trayEl = $('tray'), scoreEl = $('score'), bestEl = $('best'), streakEl = $('streak');
  const restartBtn = $('restart'), againBtn = $('again'), finalEl = $('finalScore'), noteEl = $('finalNote'), hintEl = $('hint');

  const store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const reduced = function () { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const fmt = function (n) { return Number(n).toLocaleString(); };

  let best = parseInt(store.get('misprint-best') || '0', 10) || 0;
  let st = null;
  let cellPx = 44;
  let drag = null;
  let shown = 0, tween = 0;
  const cells = [];

  for (let r = 0; r < N; r++) {
    cells.push([]);
    for (let c = 0; c < N; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      boardEl.insertBefore(el, fxEl);
      cells[r].push(el);
    }
  }

  function layout() {
    const W = app.clientWidth;
    const boardMax = Math.min(W, 440);
    const slotW = (boardMax - 16) / 3;
    let tc = Math.min(Math.floor((slotW - 14) / 5), 30);
    app.style.setProperty('--tray-h', (tc * 5 + 8 + 18) + 'px');
    const side = Math.max(160, Math.min(stage.clientWidth, stage.clientHeight, 440));
    cellPx = Math.max(16, Math.floor((side - 2 * PAD - 7 * GAP) / 8));
    tc = Math.min(tc, Math.floor(cellPx * 0.62));
    app.style.setProperty('--cell', cellPx + 'px');
    app.style.setProperty('--tc', tc + 'px');
  }

  function paintBoard(pv) {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = st.grid[r][c], key = r * N + c;
        let cls = 'cell';
        if (v >= 0) cls += ' f k' + v;
        if (pv) {
          if (pv.ghost.has(key)) cls += ' g k' + pv.color;
          if (pv.hot.has(key)) cls += ' hot';
        }
        if (cells[r][c].className !== cls) cells[r][c].className = cls;
      }
    }
  }

  function renderTray() {
    trayEl.innerHTML = '';
    st.tray.forEach(function (p, i) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.i = String(i);
      if (p) {
        const d = dims(p.cells);
        const pc = document.createElement('div');
        pc.className = 'piece';
        pc.style.gridTemplateColumns = 'repeat(' + d.w + ', var(--tc))';
        pc.style.gridTemplateRows = 'repeat(' + d.h + ', var(--tc))';
        p.cells.forEach(function (q) {
          const b = document.createElement('div');
          b.className = 'blk k' + p.color;
          b.style.gridRow = String(q[0] + 1);
          b.style.gridColumn = String(q[1] + 1);
          pc.appendChild(b);
        });
        slot.appendChild(pc);
        if (!fitsAnywhere(st.grid, p.cells)) slot.classList.add('stuck');
      } else {
        slot.classList.add('used');
      }
      trayEl.appendChild(slot);
    });
  }

  function setScore(v) {
    cancelAnimationFrame(tween);
    if (reduced()) { shown = v; scoreEl.textContent = fmt(v); return; }
    const from = shown, t0 = performance.now();
    const dur = Math.min(500, 120 + Math.abs(v - from) * 6);
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
    function f(t) {
      const k = Math.min(1, (t - t0) / dur);
      shown = Math.round(from + (v - from) * k);
      scoreEl.textContent = fmt(shown);
      if (k < 1) tween = requestAnimationFrame(f);
    }
    tween = requestAnimationFrame(f);
  }

  function hud() {
    streakEl.classList.toggle('on', st.streak >= 2);
    streakEl.textContent = 'Streak ×' + st.streak;
    bestEl.textContent = fmt(best);
    hintEl.textContent = st.moves < 1
      ? 'Drag a piece onto the grid. Fill a row or column to clear it.'
      : 'Clear at least one line every three moves to keep your streak.';
  }

  function serialize() {
    if (!st) return null;
    return { grid: st.grid, tray: st.tray, score: st.score, streak: st.streak, miss: st.miss, moves: st.moves, over: st.over, startBest: st.startBest };
  }
  function persist() {
    if (st.over) store.del('misprint-save');
    else store.set('misprint-save', JSON.stringify(serialize()));
  }
  function validSave(d) {
    try {
      if (!d || !Array.isArray(d.grid) || d.grid.length !== N) return false;
      for (let i = 0; i < d.grid.length; i++) {
        const row = d.grid[i];
        if (!Array.isArray(row) || row.length !== N) return false;
        if (row.some(function (v) { return !Number.isInteger(v) || v < -1 || v >= COLORS; })) return false;
      }
      if (!Array.isArray(d.tray) || d.tray.length !== 3) return false;
      for (let i = 0; i < 3; i++) {
        const p = d.tray[i];
        if (p === null) continue;
        if (!p || !Array.isArray(p.cells) || !p.cells.length || !Number.isInteger(p.color) || p.color < 0 || p.color >= COLORS) return false;
        for (let j = 0; j < p.cells.length; j++) {
          const q = p.cells[j];
          if (!Array.isArray(q) || q.length !== 2 || !q.every(function (x) { return Number.isInteger(x) && x >= 0 && x < 5; })) return false;
        }
      }
      return Number.isFinite(d.score);
    } catch (e) { return false; }
  }

  function anyFits() {
    return st.tray.some(function (p) { return p && fitsAnywhere(st.grid, p.cells); });
  }

  function showOver(immediate) {
    st.over = true;
    store.del('misprint-save');
    finalEl.textContent = fmt(st.score);
    noteEl.textContent = (st.score > 0 && st.score > st.startBest) ? 'New best score' : 'Best ' + fmt(best);
    if (immediate) overEl.hidden = false;
    else setTimeout(function () { if (st && st.over) overEl.hidden = false; }, 700);
  }

  function afterLoad() {
    cancelAnimationFrame(tween);
    shown = st.score;
    scoreEl.textContent = fmt(st.score);
    fxEl.innerHTML = '';
    paintBoard(null);
    renderTray();
    hud();
    if (st.over) showOver(true);
    else {
      overEl.hidden = true;
      if (!anyFits()) showOver(true);
      else persist();
    }
  }

  function newGame() {
    const grid = emptyGrid();
    st = { grid: grid, tray: makeTray(grid, Math.random), score: 0, streak: 0, miss: 0, moves: 0, over: false, startBest: best };
    afterLoad();
  }
  function restore(d) {
    st = {
      grid: d.grid, tray: d.tray, score: d.score | 0, streak: d.streak | 0, miss: d.miss | 0, moves: d.moves | 0,
      over: !!d.over, startBest: Number.isFinite(d.startBest) ? d.startBest : best
    };
    if (st.tray.every(function (p) { return p === null; })) st.tray = makeTray(st.grid, Math.random);
    afterLoad();
  }

  /* ---------- Effects ---------- */
  function burst(cleared, orR, orC) {
    const step = cellPx + GAP;
    cleared.forEach(function (q) {
      const b = document.createElement('div');
      const dist = Math.abs(q[0] - orR) + Math.abs(q[1] - orC);
      b.className = 'burst blk k' + q[2];
      b.style.left = (PAD + q[1] * step) + 'px';
      b.style.top = (PAD + q[0] * step) + 'px';
      b.style.width = cellPx + 'px';
      b.style.height = cellPx + 'px';
      b.style.setProperty('--d', Math.min(240, Math.round(dist * 20)) + 'ms');
      b.addEventListener('animationend', function () { b.remove(); });
      fxEl.appendChild(b);
    });
  }
  function popText(points, sub, centerR, centerC) {
    const step = cellPx + GAP;
    const el = document.createElement('div');
    el.className = 'pop';
    el.style.left = Math.max(60, Math.min(PAD + (centerC + 0.5) * step, boardEl.clientWidth - 60)) + 'px';
    el.style.top = Math.max(50, Math.min(PAD + (centerR + 0.5) * step, boardEl.clientHeight - 40)) + 'px';
    const b = document.createElement('b');
    b.textContent = '+' + fmt(points);
    el.appendChild(b);
    if (sub) {
      const s = document.createElement('span');
      s.textContent = sub;
      el.appendChild(s);
    }
    el.addEventListener('animationend', function () { el.remove(); });
    fxEl.appendChild(el);
  }

  /* ---------- Moves ---------- */
  function commit(i, r, c) {
    const p = st.tray[i];
    const d = dims(p.cells);
    const res = applyMove(st.grid, p, r, c);
    let gain = p.cells.length;
    st.grid = res.grid;
    st.tray[i] = null;
    st.moves++;

    if (res.lines > 0) {
      st.streak++;
      st.miss = 0;
      const pts = clearPoints(res.lines, st.streak);
      gain += pts;
      const names = ['', '', 'Double', 'Triple'];
      const parts = [];
      if (res.lines >= 2) parts.push(names[res.lines] || 'Mega');
      if (st.streak >= 2) parts.push('Streak ×' + st.streak);
      const clean = st.grid.every(function (row) { return row.every(function (v) { return v < 0; }); });
      if (clean) { gain += 100; parts.push('Clean board'); }
      const cr = r + (d.h - 1) / 2, cc = c + (d.w - 1) / 2;
      burst(res.cleared, cr, cc);
      popText(pts + (clean ? 100 : 0), parts.join(' · '), cr, cc);
    } else {
      st.miss++;
      if (st.miss >= 3) { st.streak = 0; st.miss = 0; }
    }

    st.score += gain;
    if (st.score > best) {
      best = st.score;
      store.set('misprint-best', String(best));
    }
    if (st.tray.every(function (q) { return q === null; })) st.tray = makeTray(st.grid, Math.random);

    try { if (navigator.vibrate) navigator.vibrate(res.lines ? [12, 30, 12] : 8); } catch (e) {}
    setScore(st.score);
    paintBoard(null);
    renderTray();
    hud();
    if (!anyFits()) showOver(false);
    else persist();
  }

  /* ---------- Dragging ---------- */
  function startDrag(i, e, slot) {
    const p = st.tray[i];
    const d = dims(p.cells);
    const el = document.createElement('div');
    el.className = 'drag';
    el.style.gridTemplateColumns = 'repeat(' + d.w + ', ' + cellPx + 'px)';
    el.style.gridTemplateRows = 'repeat(' + d.h + ', ' + cellPx + 'px)';
    p.cells.forEach(function (q) {
      const b = document.createElement('div');
      b.className = 'blk k' + p.color;
      b.style.gridRow = String(q[0] + 1);
      b.style.gridColumn = String(q[1] + 1);
      el.appendChild(b);
    });
    document.body.appendChild(el);
    drag = {
      i: i, p: p, el: el, slot: slot, id: e.pointerId, target: null, key: '',
      pw: d.w * cellPx + (d.w - 1) * GAP,
      ph: d.h * cellPx + (d.h - 1) * GAP,
      touch: e.pointerType !== 'mouse'
    };
    slot.classList.add('lifted');
    try { slot.setPointerCapture(e.pointerId); } catch (err) {}
    moveDrag(e);
  }

  function moveDrag(e) {
    const d = drag;
    if (!d) return;
    const lift = d.touch ? d.ph / 2 + cellPx * 1.1 : 0;
    const left = e.clientX - d.pw / 2;
    const top = e.clientY - lift - d.ph / 2;
    d.el.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(1.04)';
    const rect = boardEl.getBoundingClientRect();
    const step = cellPx + GAP;
    const c = Math.round((left - rect.left - PAD) / step);
    const r = Math.round((top - rect.top - PAD) / step);
    const key = r + ',' + c;
    if (key === d.key) return;
    d.key = key;
    if (canPlace(st.grid, d.p.cells, r, c)) {
      d.target = { r: r, c: c };
      const res = applyMove(st.grid, d.p, r, c);
      const ghost = new Set(), hot = new Set();
      d.p.cells.forEach(function (q) { ghost.add((r + q[0]) * N + c + q[1]); });
      res.rows.forEach(function (rr) { for (let cc = 0; cc < N; cc++) hot.add(rr * N + cc); });
      res.cols.forEach(function (cc) { for (let rr = 0; rr < N; rr++) hot.add(rr * N + cc); });
      paintBoard({ ghost: ghost, hot: hot, color: d.p.color });
    } else {
      d.target = null;
      paintBoard(null);
    }
  }

  function endDrag(cancelled) {
    const d = drag;
    if (!d) return;
    drag = null;
    d.el.remove();
    d.slot.classList.remove('lifted');
    paintBoard(null);
    if (!cancelled && d.target) commit(d.i, d.target.r, d.target.c);
  }

  trayEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (drag) endDrag(true);
    if (!st || st.over) return;
    const slot = e.target.closest('.slot');
    if (!slot) return;
    const i = parseInt(slot.dataset.i, 10);
    if (!st.tray[i]) return;
    e.preventDefault();
    startDrag(i, e, slot);
  });
  window.addEventListener('pointermove', function (e) { if (drag && e.pointerId === drag.id) { e.preventDefault(); moveDrag(e); } });
  window.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.id) endDrag(false); });
  window.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.id) endDrag(true); });
  window.addEventListener('blur', function () { if (drag) endDrag(true); });
  app.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- Buttons ---------- */
  let armed = false, armTimer = 0;
  function disarm() { armed = false; clearTimeout(armTimer); restartBtn.textContent = 'New game'; }
  restartBtn.addEventListener('click', function () {
    if (!st || st.over || st.moves < 1) { disarm(); newGame(); return; }
    if (!armed) {
      armed = true;
      restartBtn.textContent = 'Tap again';
      armTimer = setTimeout(disarm, 2500);
    } else {
      disarm();
      newGame();
    }
  });
  againBtn.addEventListener('click', function () { disarm(); newGame(); });

  /* ---------- Boot ---------- */
  function start(data) {
    layout();
    if (data && validSave(data)) { restore(data); return; }
    let saved = null;
    try { saved = JSON.parse(store.get('misprint-save') || 'null'); } catch (e) {}
    if (saved && validSave(saved)) restore(saved);
    else newGame();
  }

  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(layout).observe(app);
  window.addEventListener('resize', layout);

  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return serialize(); }); } catch (e) {}
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body></html>
